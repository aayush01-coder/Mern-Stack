<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap-Forms</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="styple.css">
</head>
<body>
  <h2>Forms Demo</h2>
  <form class="mb-3">
    <div class="row">
    <div class=" col-md-6" >
      <label  class="form-label" for="email">Email</label>
    <input type="text" placeholder="Email" class="form-control" id="email">
    </div>
    
    <div class="mb-3 col-md-6">
      <label  class="form-label" for="password">Password</label>
    <input type="text" placeholder="Password" class="form-control" id="password">
  
    </div>
    </div>
    
    <label  class="form-label" for="address">Address</label>
    <input type="text" placeholder="Address" class="form-control-lg" id="address">
   
   
    <!-- <h3>Form Select  </h3> to create droupdown -->
  <div class="mb-3">
    <select  class="form-select">
      <option selected >Chosse your city</option>
      <option value="1">Mumbai</option>
      <option value="2">Delhi</option>
      <option value="3">Uttar Pradesh</option>
    </select>
  </div>
  <div class="normal mb-3 form-check">
    <input type="checkbox" id="agree" class="form-check-input">
    <label for="agree" class="form-check-label">Agree</label>
  </div>
  <div class="normal mb-3 form-check">
    <input type="checkbox" id="agreebs" class="form-check-input">
    <label for="agreebs" class="form-check-label">Agree</label>
  </div>
  <div class="normal mb-3 form-check">
    <input type="radio" id="radiobs" class="form-check-input">
    <label for="radiobs" class="form-check-label">Yes/No</label>
  </div>
  <div class="form-check-input form-check-switch mb-3">
    <input type="checkbox" role="switch" id="flexSwitchCheckDefault">
    <label for="flexSwitchCheckDefault" class="form-check-label">Default radio</label>
  </div>
  </form>
  




</body>
</html>
